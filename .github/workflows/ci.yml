name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── 1. Backend: lint + unit tests ─────────────────────────────────────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: cd backend && python -m ruff check .

      - name: Run tests
        run: cd backend && python -m pytest --tb=short -q
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production

  # ── 2. Frontend: typecheck + unit tests ────────────────────────────────────
  frontend:
    name: Frontend tests + typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Run tests
        run: cd frontend && npm run test

  # ── 3. Docker build smoke test ─────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Integration smoke test (backend + neo4j) ────────────────────────────
  smoke:
    name: Backend smoke test
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.15
        ports:
          - "7687:7687"
          - "7474:7474"
        env:
          NEO4J_AUTH: neo4j/alexiona123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Start backend
        run: |
          cd backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3
        env:
          SECRET_KEY: ci-smoke-test-secret-key
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: alexiona123
          OPENAI_API_KEY: sk-placeholder-not-used-in-health-check

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting... ($i/10)"
            sleep 2
          done
          echo "Backend did not start in time"
          exit 1
