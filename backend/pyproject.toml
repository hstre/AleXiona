[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # line length handled above
  "B904",   # raise-without-from-inside-except — existing codebase pattern
  "E741",   # ambiguous variable name — l used in list comprehensions
  "E402",   # module-level import not at top — load_dotenv() must run first
  "SIM102", # collapsible-if — readability preference
  "SIM105", # suppressible-exception — contextlib.suppress style preference
  "F821",   # undefined-name — false positives from string annotations / TYPE_CHECKING
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
